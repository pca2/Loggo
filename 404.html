<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    // GitHub Pages SPA redirect: serves index.html for all paths.
    // Preserves the full path so app.js can extract the secret.
    sessionStorage.setItem('redirect', window.location.pathname);
    window.location.replace(
      window.location.origin +
      window.location.pathname.split('/').slice(0, -1).join('/') +
      '/'
    );
  </script>
</head>
<body></body>
</html>
